[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e_book_reader"
version = "0.2.0a9"
description = "Offline Vietnamese expressive audiobook workstation with crash-safe checkpoints"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6==6.8.0",
  "requests==2.32.3",
  "psutil==6.0.0",
  "numpy==1.26.4",
  "soundfile==0.13.1",
  "imageio-ffmpeg==0.6.0",
  "huggingface-hub==0.30.0",
  "openai-whisper==20250625",
  "vieneu==3.2.3",
  "voxcpm==2.0.3",
]

[project.scripts]
e_book_reader = "e_book_reader.gui:run_gui"

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.9.10"]

[tool.setuptools.packages.find]
include = ["e_book_reader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
