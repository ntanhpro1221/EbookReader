[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook_reader"
version = "0.2.0a14"
description = "Offline Vietnamese expressive audiobook workstation with crash-safe checkpoints"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6==6.11.2",
  "requests==2.34.2",
  "psutil==7.2.2",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "soundfile==0.14.0",
  "pyloudnorm==0.2.0",
  "pyworld==0.3.5",
  "imageio-ffmpeg==0.6.0",
  "openai-whisper==20250625",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
  "huggingface-hub==1.29.0",
  "librosa==0.11.0",
  "timm==1.0.29",
  "transformers==5.16.1",
  "utmosv2 @ git+https://github.com/sarulab-speech/UTMOSv2.git@cc2700db57bb83ee13dc31ebe1b868c254e15d09",
  "vieneu==3.3.0",
  # Vietnamese phoneme comparison for locked-name ASR anchors. Arrives with vieneu,
  # but asr.py imports it directly, so it is pinned directly.
  "sea-g2p==0.9.1",
  # Praat, via parselmouth, moves a character's formants without ever rebuilding the
  # spectrum: it resamples and restores pitch with PSOLA. Compared by ear against a
  # WORLD envelope warp and a PARCOR area-function reshape, it was the one kept.
  "praat-parselmouth==0.4.7",
]

[project.scripts]
ebook_reader = "ebook_reader.gui:run_gui"
ebook-reader-headless = "ebook_reader.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.5"]

[tool.setuptools.packages.find]
include = ["ebook_reader*"]

[tool.setuptools.package-data]
ebook_reader = [
  "assets/*.ico",
  "assets/*.png",
  "assets/*.dict",
  "assets/CMUDICT_LICENSE.txt",
  "assets/voice_previews/*.wav",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
