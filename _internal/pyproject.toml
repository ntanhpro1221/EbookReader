[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook_reader"
version = "0.2.0a10"
description = "Offline Vietnamese expressive audiobook workstation with crash-safe checkpoints"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6==6.8.0",
  "requests==2.32.3",
  "psutil==6.0.0",
  "numpy==1.26.4",
  "scipy==1.17.1",
  "soundfile==0.13.1",
  "pyloudnorm==0.1.1",
  "pyworld==0.3.5",
  "imageio-ffmpeg==0.6.0",
  "openai-whisper==20250625",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
  "huggingface-hub==1.7.1",
  "librosa==0.11.0",
  "timm==1.0.28",
  "transformers==5.7.0",
  "utmosv2 @ git+https://github.com/sarulab-speech/UTMOSv2.git@cc2700db57bb83ee13dc31ebe1b868c254e15d09",
  "vieneu==3.2.3",
]

[project.scripts]
ebook_reader = "ebook_reader.gui:run_gui"
ebook-reader-headless = "ebook_reader.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.9.10"]

[tool.setuptools.packages.find]
include = ["ebook_reader*"]

[tool.setuptools.package-data]
ebook_reader = [
  "assets/*.ico",
  "assets/*.png",
  "assets/*.dict",
  "assets/CMUDICT_LICENSE.txt",
  "assets/voice_previews/*.wav",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
